<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0d">
<meta name="description" content="A retro tank-defence arcade game for phones. Guard the beacon, beat the Ironclad, build your own maps and play online co-op.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Squad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Iron Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet. HUD strip, square playfield, d-pad + fire below (beside it in landscape). Deliberately single dark theme. */
:root{
  --bg:#0b0e0d; --panel:#151a18; --line:#26302b; --fg:#ece6d4; --muted:#88928b;
  --amber:#f2b134; --amber-d:#8a5c10; --red:#e2553f; --cyan:#5fe3d0;
  --display:'Silkscreen','Courier New',monospace;
  --body:'Chakra Petch',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"hud hud" "stage stage" "pad fire";gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 18px}
#hud{grid-area:hud;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"sect btns" "stats stats";gap:8px 12px;align-items:center;font-family:var(--display);min-width:0}
.hsect{grid-area:sect;display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.hsect b{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:400}
#hStage{font-size:18px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
#hMap{font-size:11px;letter-spacing:.1em;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbtns{grid-area:btns;display:flex;gap:8px;align-items:center}
.hstats{grid-area:stats;display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding-block:7px;min-width:0}
.stat{display:flex;flex-direction:column;gap:5px;padding-inline:10px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat b{font-size:8px;letter-spacing:.14em;color:var(--muted);font-weight:400;line-height:1}
.stat span{display:block;font-size:15px;line-height:15px;height:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score{color:var(--amber)}
.stat .rank{display:flex;gap:4px;align-items:center;overflow:visible}
.rank i{width:9px;height:9px;background:var(--line);display:block}
.rank i.on{background:var(--amber)}
.ibtn{width:38px;height:38px;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;border-radius:6px;padding:0;cursor:pointer}
.ibtn:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ibtn svg{width:18px;height:18px}
#stage{grid-area:stage;min-width:0;min-height:0;display:grid;place-items:center}
#screen{position:relative;width:300px;height:300px;box-shadow:0 0 0 2px var(--line),0 0 0 6px var(--panel)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,12,11,.84);overflow:auto;padding:14px;box-sizing:border-box}
#overlay[hidden]{display:none!important}
.card{display:flex;flex-direction:column;gap:10px;max-width:290px;width:100%}
.eyebrow{font-family:var(--display);font-size:9px;letter-spacing:.16em;color:var(--cyan);margin:0}
.card h1,.card h2{font-family:var(--display);font-weight:700;margin:0;color:var(--amber);text-shadow:3px 3px 0 var(--amber-d);text-wrap:balance;line-height:.9}
.card h1{font-size:clamp(34px,13vw,52px)}
.card h2{font-size:clamp(22px,8vw,30px)}
.card p{margin:0;font-size:13px;line-height:1.4;color:var(--fg)}
.card .muted{color:var(--muted);font-size:12px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend canvas{width:18px;height:18px;image-rendering:pixelated;flex:none}
.tally{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px 10px;align-items:center;font-family:var(--display);font-size:12px}
.tally .chip{width:10px;height:10px}
.tally .n,.tally .p{text-align:right;font-variant-numeric:tabular-nums}
.tally .tot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:6px;display:flex;justify-content:space-between;color:var(--amber)}
.btn{font-family:var(--display);font-size:15px;letter-spacing:.06em;background:var(--amber);color:#1b1306;border:0;border-bottom:4px solid var(--amber-d);padding:11px 16px 9px;border-radius:4px;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--panel);color:var(--fg);border-bottom-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.pick{display:flex;flex-direction:column;gap:6px}
.pick b{font-family:var(--display);font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:400}
.sectors{display:flex;flex-wrap:wrap;gap:5px;max-height:100px;overflow-y:auto}
.sec{font-family:var(--display);font-size:13px;width:34px;height:34px;padding:0;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.sec.on{background:var(--cyan);border-color:var(--cyan);color:#06201c}
.sec:disabled{color:var(--line);cursor:default}
#pad{grid-area:pad;justify-self:start;align-self:center;width:var(--padsz);height:var(--padsz);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;touch-action:none}
.pb{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.pb svg{width:22px;height:22px}
.pb.on{background:var(--amber);color:#1b1306;border-color:var(--amber)}
#pu{grid-area:1/2}#pl{grid-area:2/1}#pr{grid-area:2/3}#pd{grid-area:3/2}
.nub{grid-area:2/2;display:grid;place-items:center}
.nub::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--line)}
#fire{grid-area:fire;justify-self:end;align-self:center;width:var(--firesz);height:var(--firesz);border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#ffd77a,var(--amber) 55%,#c98a1c);border:3px solid var(--amber-d);
  box-shadow:0 5px 0 var(--amber-d);font-family:var(--display);font-size:16px;color:#1b1306;touch-action:none;cursor:pointer}
#fire.on{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-d)}
.keys{display:none;font-size:11px;color:var(--muted)}
[hidden]{display:none!important}
#fireWrap{grid-area:fire;justify-self:end;align-self:center;position:relative}
#mineBtn{position:absolute;left:-16px;top:-16px;z-index:1;width:54px;height:54px;border-radius:50%;padding:0;background:var(--panel);border:2px solid var(--red);color:var(--fg);font-family:var(--display);font-size:9px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;cursor:pointer}
#mineBtn b{font-size:14px;line-height:1;color:var(--red)}
#app.lefty #mineBtn{left:auto;right:-16px}
#editBar{grid-column:1/-1;grid-row:3;display:flex;flex-direction:column;gap:8px;min-width:0}
.pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pbr{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--fg);font-family:var(--display);font-size:10px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.pbr canvas{width:20px;height:20px;flex:none;image-rendering:pixelated}
.pbr.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.ebtns{display:flex;gap:6px}
.ebtns .btn{flex:1;font-size:11px;padding:10px 2px 8px;min-width:0}
#app.editing #pad,#app.editing #stickZone,#app.editing #fireWrap{display:none!important}
.stars{display:flex;gap:8px;justify-content:center}
.star{width:32px;height:32px;fill:var(--line)}
.star.on{fill:var(--amber);filter:drop-shadow(0 2px 0 var(--amber-d))}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.crit li::before{content:"✕";display:inline-block;width:16px;color:var(--red)}
.crit li.ok{color:var(--fg)}
.crit li.ok::before{content:"✓";color:var(--cyan)}
.credits{font-family:var(--display);font-size:12px;color:var(--amber);margin:0}
.upg{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;align-items:center;gap:10px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px}
.uinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.uinfo b{font-family:var(--display);font-size:12px;font-weight:400}
.uinfo .muted{font-size:11px}
.pips{display:flex;gap:3px}.pips i{width:12px;height:4px;background:var(--line);display:block}.pips i.on{background:var(--cyan)}
.ubuy{flex:none;min-width:64px;font-size:12px;padding:8px 6px 6px}
.mapcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;background:var(--panel);border:1px dashed var(--line);border-radius:4px;padding:8px;user-select:text;-webkit-user-select:text}
.mapin{width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;resize:none;user-select:text;-webkit-user-select:text}
.mapin:focus{outline:2px solid var(--amber);outline-offset:1px}
.sec{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.maps{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:8px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:5px;min-width:0}
.mthumb{width:52px;height:52px;flex:none;image-rendering:pixelated;border:1px solid var(--line)}
.minfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.minfo b{font-family:var(--display);font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .muted{font-size:11px}
.mbtns{display:flex;gap:4px;flex:none}
.mbtns .ubuy{min-width:0;padding:8px 7px 6px;font-size:11px}
.namein{width:100%;box-sizing:border-box;font-family:var(--body);font-size:16px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;user-select:text;-webkit-user-select:text}
.namein:focus{outline:2px solid var(--amber);outline-offset:1px}
.ss{display:flex;gap:2px}.ss i{width:5px;height:5px;background:var(--line);display:block}.ss i.on{background:var(--amber)}
#screen.crt{border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 0 0 6px var(--panel),0 0 28px rgba(242,177,52,.14)}
#screen.crt #cv{filter:saturate(1.15) contrast(1.06) brightness(1.05)}
#app{--padsz:164px;--firesz:108px}
#app[data-size="s"]{--padsz:136px;--firesz:92px}
#app[data-size="l"]{--padsz:196px;--firesz:128px}
#app.lefty{grid-template-areas:"hud hud" "stage stage" "fire pad"}
#app.lefty #pad{justify-self:end}#app.lefty #fireWrap{justify-self:start}
#stickZone{grid-area:pad;align-self:stretch;justify-self:stretch;position:relative;touch-action:none;min-height:var(--padsz);min-width:var(--padsz)}
#stickBase{position:absolute;width:var(--padsz);height:var(--padsz);box-sizing:border-box;border-radius:50%;background:radial-gradient(circle,var(--panel) 0 62%,#101413 63%);border:1px solid var(--line)}
#stickBase::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px dashed var(--line)}
#stickKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#3a443f,#222a26);border:2px solid #3a443f;box-shadow:0 3px 0 #070908}
#stickZone.active #stickKnob{background:radial-gradient(circle at 38% 32%,#ffd77a,var(--amber) 60%);border-color:var(--amber-d)}
.stick-fixed #stickBase{left:0;top:50%;margin-top:calc(var(--padsz) / -2)}
#app.lefty .stick-fixed #stickBase{left:auto;right:0}
.stick-float #stickBase{opacity:0;left:50%;top:50%;margin:calc(var(--padsz) / -2) 0 0 calc(var(--padsz) / -2);transition:opacity .12s}
.stick-float.active #stickBase{opacity:1}
.stick-float::after{content:"TOUCH AND DRAG";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:10px;letter-spacing:.14em;color:var(--muted);border:1px dashed var(--line);border-radius:10px;pointer-events:none}
.stick-float.active::after{opacity:0}
.opt{display:flex;flex-direction:column;gap:5px}
.opt>b{font-family:var(--display);font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.segb{flex:1;font-family:var(--display);font-size:12px;padding:9px 4px 7px;background:var(--panel);color:var(--fg);border:0;border-left:1px solid var(--line);cursor:pointer}
.segb:first-child{border-left:0}
.segb.on{background:var(--amber);color:#1b1306}
@media (orientation:landscape){
  #app{grid-template-columns:minmax(calc(var(--padsz) + 12px),1fr) minmax(0,3fr) minmax(calc(var(--padsz) + 12px),1fr);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"pad hud fire" "pad stage fire";padding-block:8px 10px}
  #pad,#fireWrap,#app.lefty #pad,#app.lefty #fireWrap{justify-self:center}
  #editBar{grid-area:pad;align-self:center}
  .pal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ebtns{flex-wrap:wrap}
  .ebtns .btn{flex:1 1 40%}
  #app.lefty{grid-template-areas:"fire hud pad" "fire stage pad"}
  #hud{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"sect stats btns"}
  .hsect{flex-direction:column;align-items:flex-start;gap:4px}
  #hMap{display:none}
  .stick-fixed #stickBase,#app.lefty .stick-fixed #stickBase{left:50%;right:auto;margin-left:calc(var(--padsz) / -2)}
}
@media (hover:hover) and (pointer:fine){
  #pad,#fireWrap,#stickZone{display:none}
  .keys{display:block}
}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:2;pointer-events:none;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--display);font-size:11px;padding:6px 10px;border-radius:4px;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.4;cursor:default}
.code{font-family:var(--display);font-size:clamp(34px,12vw,48px);letter-spacing:.18em;text-indent:.18em;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:4px;padding:8px 0 4px;user-select:text;-webkit-user-select:text;font-variant-numeric:tabular-nums}
.codein{font-family:var(--display);font-size:28px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;text-align:center;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.codein:focus{outline:2px solid var(--amber);outline-offset:1px}
.you{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
@media (prefers-reduced-motion:reduce){.btn:active,#fire.on{transform:none}}
</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>

<body>
<div id="app">
  <header id="hud">
    <div class="hsect"><b>SECTOR</b><span id="hStage">1</span><span id="hMap">ORCHARD</span></div>

    <button class="ibtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
    </div>
    <div class="hstats">

  <div id="stickZone" hidden aria-label="Thumbstick"><div id="stickBase"><div id="stickKnob"></div></div></div>

  </div>
</div>

 for(let st=0;st<16;st++){mel[st]=m0[st];mel[16+st]=m0[st]==null?null:m0[st]+sh;mel[32+st]=m2[st];mel[48+st]=st<11?m0[st]:null}

function collide(b){
 if(b.x<0||b.x>=WD||b.y<0||b.y>=WD){
  if(b.rico>0){b.rico--;b.dir=(b.dir+2)%4;b.x=Math.max(1,Math.min(WD-1,b.x));b.y=Math.max(1,Math.min(WD-1,b.y));fx('steel',b.x,b.y);sfx('steel');return}

 if(b.dir%2===0){const r=Math.floor(b.y/C);cells=[[Math.floor((b.x-4)/C),r],[Math.floor((b.x+3)/C),r]]}

 let hit=false,steel=false,brk=false,barrel=false;
 for(const[x,y]of cells){if(x<0||y<0||x>=N||y>=N)continue;const i=y*N+x,v=grid[i];
  if(!b.player&&isRing(x,y)&&(v===1||v===2))wallHit=true;
  if(v===1){grid[i]=0;hit=true;brk=true;gridDirty=true;crackNb(i)}
  else if(v===2){hit=true;steel=true;if(b.power){grid[i]=0;gridDirty=true}}
  else if(v===5){hit=true;destroyBase()}else if(v===6)hit=true;
  else if(v===7){hit=true;barrel=true;explodeBarrel(i,b.player?b.owner.idx:null)}}
 if(hit&&steel&&!brk&&!barrel&&!b.power&&b.rico>0){b.rico--;b.dir=(b.dir+2)%4;b.x+=DIRS[b.dir][0]*3;b.y+=DIRS[b.dir][1]*3;fx('steel',b.x,b.y);sfx('steel');return}
 if(hit){b.dead=true;boom(b.x,b.y,false);if(steel)fx('steel',b.x,b.y);else if(brk)fx('brick',b.x,b.y);if(b.player)sfx(steel&&!b.power?'steel':'brick');return}

  for(const e of enemies)if(e.alive&&e.spawn<=0&&inT(e)){b.dead=true;hitEnemy(e,b.owner.idx,b);return}
  for(const p of players)if(p!==b.owner&&p.alive&&p.spawn<=0&&inT(p)){b.dead=true;boom(b.x,b.y,false);if(p.shield<=0){p.stun=1.5;sfx('clink');buzzP(p.idx,40)}return}
 }else for(const p of players)if(p.alive&&p.spawn<=0&&inT(p)){b.dead=true;if(p.shield>0)boom(b.x,b.y,false);else hurtPlayer(p);return}
}

let netAvailable=false,net=null,lobbyRole=null,lobbyStatus='',joinCode='',lastScr={k:'play'},snapT=0,snapN=0,lastIn={d:null,f:false};
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){const a=new Uint32Array(4);crypto.getRandomValues(a);return [...a].map(n=>CODE_CHARS[n%CODE_CHARS.length]).join('')}
const cleanCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
function connect(role,code){

 let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws?room='+code+'&role='+role)}catch(e){onNetClosed();return}
 const mine={ws,role,code,peer:false};net=mine;
 ws.onmessage=e=>{if(net!==mine)return;let m;try{m=JSON.parse(e.data)}catch(_){return}onNet(m)};
 ws.onclose=()=>{if(net!==mine)return;net=null;onNetClosed()};
}
function leaveNet(){if(net){const n=net;net=null;try{n.ws.close()}catch(e){}}}
function send(m){if(net&&net.ws.readyState===1)net.ws.send(JSON.stringify(m))}
function hostScreen(k,d,fresh){if(mode!=='host')return;lastScr={k,d,fresh};if(net&&net.peer){send({t:'scr',k,d,fresh:!!fresh});if(k==='play')sendSnap()}}

function onNet(m){
 if(m.t==='ok'){if(net.role==='host'){lobbyStatus='Waiting for player 2 to join…';showLobby()}else{mode='guest';send({t:'up',u:prof.up});showLobby()}return}
 if(m.t==='err'){
  if(m.e==='taken'&&net&&net.role==='host'){connect('host',genCode());showLobby();return}
  lobbyStatus={nohost:'No game found with that code. Check it and try again.',full:'That game already has two players.'}[m.e]||'Could not join that game.';
  leaveNet();setStatus();return}
 if(mode==='host'){
  if(m.t==='peer-joined'){net.peer=true;SFX.bonus();
   if(state==='lobby'){lobbyStatus='Player 2 is in. Tap Start when you’re ready.';showLobby()}
   else if(inGame()){toast('Player 2 joined');
    if(state!=='over'){coop=true;if(!players[1]){players[1]=makePlayer(1,0);lives[1]=2}else if(players[1].out){players[1]=makePlayer(1,0);lives[1]=Math.max(lives[1],1)}}
    send({t:'scr',k:'play',fresh:true});sendSnap();if(lastScr.k!=='play')send({t:'scr',k:lastScr.k,d:lastScr.d})}
   return}
  if(m.t==='peer-left'){net.peer=false;remote={d:null,f:false,m:false};remoteUp=null;
   if(state==='lobby'){lobbyStatus='Player 2 left. Waiting for someone to join…';showLobby()}
   else{const p=players[1];if(p){p.alive=false;p.out=true;lives[1]=0}toast('Player 2 left')}
   return}
  if(m.t==='in'){const d=m.d;remote={d:(d===0||d===1||d===2||d===3)?d:null,f:!!m.f,m:remote.m};return}
  if(m.t==='mine'){remote.m=true;return}
  if(m.t==='up'){remoteUp=cleanUp(m.u);return}
  if(m.t==='pause'){pause();return}
  if(m.t==='resume'){resume();return}
  return}
 if(mode==='guest'){
  if(m.t==='s')applySnap(m);
  else if(m.t==='scr')onScreen(m);
  else if(m.t==='host-left')hostGone('The host left the game.');
 }
}
function onNetClosed(){
 if(mode==='guest'){hostGone('Lost the connection to the host.');return}
 if(state==='lobby'){
  lobbyStatus=lobbyRole==='host'?'Could not reach the co-op server. Check your connection and try again.':(lobbyStatus==='Connecting…'?'Could not connect. Check your connection and try again.':lobbyStatus);
  if(lobbyRole==='host')showLobby();else setStatus();return}
 if(mode==='host'){mode='solo';const p=players[1];if(p){p.alive=false;p.out=true;lives[1]=0}if(inGame())toast('Co-op connection lost')}
}
function sendSnap(){
 if(!net||!net.peer){evq=[];return}
 const m={t:'s',lv:level,it:r1(Math.max(0,introT)),fz:r1(Math.max(0,freezeT)),ba:baseAlive?1:0,sc:score,li:lives,q:foesLeft(),
  P:players.map(p=>[r1(p.x),r1(p.y),p.dir,p.alive?1:0,r1(Math.max(0,p.spawn)),r1(Math.max(0,p.shield)),p.lvl,r1(Math.max(0,p.stun)),p.out?1:0,p.armor|0,p.ricoT>0?1:0,p.spreadT>0?1:0,p.turboT>0?1:0,p.droneT>0?1:0,p.mines|0]),
  E:enemies.map(e=>[e.id,r1(e.x),r1(e.y),e.dir,e.kind,e.hp,e.bonus?1:0,r1(Math.max(0,e.spawn)),r1(Math.max(0,e.flash)),e.maxhp||0]),
  B:bullets.map(b=>[r1(b.x),r1(b.y),b.dir,b.speed,b.rico>0?1:0]),
  U:powerup?[powerup.x,powerup.y,powerup.type,r1(powerup.t)]:null,ev:evq,
  cb:[combo.n,r1(Math.max(0,combo.t))],bl:bossLvl?1:0,MI:mines.map(m=>[r1(m.x),r1(m.y),m.arm>0?0:1])};
 if(gridDirty||snapN%40===0){let g='';for(let i=0;i<N*N;i++)g+=grid[i];m.g=g;m.nm=curMapName;m.tp=pads.map(q=>[q.x,q.y,q.to]);gridDirty=false}
 snapN++;evq=[];send(m)}
function applySnap(m){
 level=m.lv|0;introT=+m.it||0;freezeT=+m.fz||0;baseAlive=!!m.ba;score=+m.sc||0;lives=Array.isArray(m.li)?m.li:lives;netFoes=+m.q||0;
 if(typeof m.g==='string'&&m.g.length===N*N){for(let i=0;i<N*N;i++){const v=m.g.charCodeAt(i)-48;if(!skipCrack&&grid[i]===1&&v===0){grid[i]=0;crackNb(i)}grid[i]=v}skipCrack=false}
 players=(m.P||[]).map((a,i)=>{let p=players[i];if(!p)p={idx:i,isPlayer:true,x:a[0],y:a[1],anim:0};
  p.tx=a[0];p.ty=a[1];p.dir=a[2];p.alive=!!a[3];p.spawn=a[4];p.shield=a[5];p.lvl=a[6];p.stun=a[7];p.out=!!a[8];p.armor=a[9]|0;p.ricoT=a[10]?1:0;p.spreadT=a[11]?1:0;p.turboT=a[12]?1:0;p.droneT=a[13]?1:0;p.mines=a[14]|0;
  if(!p.alive||p.spawn>0){p.x=p.tx;p.y=p.ty}return p});
 const old=new Map(enemies.map(e=>[e.id,e]));
 enemies=(m.E||[]).map(a=>{let e=old.get(a[0]);if(!e)e={id:a[0],x:a[1],y:a[2],anim:0,isPlayer:false};
  e.tx=a[1];e.ty=a[2];e.dir=a[3];e.kind=a[4];e.hp=a[5];e.bonus=!!a[6];e.spawn=a[7];e.flash=a[8];e.alive=true;e.boss=a[4]===4;e.sz=e.boss?32:16;e.maxhp=a[9]||e.maxhp||e.hp;return e});

 if(Array.isArray(m.cb))combo={n:m.cb[0]|0,t:+m.cb[1]||0};bossLvl=!!m.bl;
 mines=(m.MI||[]).map(a=>({x:+a[0],y:+a[1],arm:a[2]?0:1}));
 if(typeof m.nm==='string')curMapName=m.nm;if(Array.isArray(m.tp))pads=m.tp.map(a=>({x:+a[0],y:+a[1],to:a[2]|0}));

 for(const ev of m.ev||[]){const k=ev[0];
  if(k==='s'&&Object.prototype.hasOwnProperty.call(SFX,ev[1]))SFX[ev[1]]();
  else if(k==='b')boom(+ev[1],+ev[2],!!ev[3]);
  else if(k==='p')pop(+ev[1],+ev[2],String(ev[3]));
  else if(k==='v')buzz(+ev[1]||20);
  else if(k==='f')runFx(String(ev[1]),+ev[2],+ev[3],+ev[4])}
}
function onScreen(m){const d=m.d||{};
 if(m.k==='play'){if(m.fresh){if(state==='lobby'||state==='over')SFX.start();enemies=[];bullets=[];booms=[];pops=[];players=[];powerup=null;mines=[];resetFx();skipCrack=true}state='play';if(ctlReturn)ctlReturn.html=null;else hide();wake()}
 else if(m.k==='clear'){state='clear';if(d.level+1>unlocked){unlocked=d.level+1;saveProgress()}if(Array.isArray(d.st))saveStars(d.level,d.st.filter(Boolean).length);addCredits(d.cr);showScreen(clearCard(d,false))}
 else if(m.k==='over'){state='over';SFX.over();addCredits(d.cr);showScreen(overCard(d,false,recordBest(d.score)))}

}
function guestTick(dt){const k=Math.min(1,dt*18);
 for(const t of tanks()){if(t.tx==null)continue;const dx=t.tx-t.x,dy=t.ty-t.y;

 else if(a==='sharelink'){const url=location.origin+location.pathname+'?map='+encodeMap(edit.rows);if(navigator.share)navigator.share({title:'Iron Squad map',text:'Try my Iron Squad map',url}).catch(()=>{});else{try{navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast(url))}catch(_){toast(url)}}}
 else if(a==='loadcode'){const el=document.getElementById('mapIn'),rows=decodeMap(el&&el.value);if(!rows){const er=document.getElementById('mapErr');if(er)er.textContent="That isn't an Iron Squad map code. Check it was copied in full, starting with IS1.";return}
  if(edit.loadNew){if(myMaps.length<12){myMaps.push(newMapObj('Shared map',rows));saveMaps();toast('Map added to My maps')}edit.loadNew=false;show(mapsCard());return}
  edit.rows=rows;customMap.rows=rows;applyMap(customMap);saveMyMap();closeControls();toast('Map loaded')}
 else if(a==='next')nextLevel();
 else if(a==='resume'){mode==='guest'?send({t:'resume'}):resume()}
 else if(a==='title')titleScreen();
 else if(a==='controls')openControls();
 else if(a==='ctldone')closeControls();
 else if(a==='ctl'){const v=b.dataset.v,k=b.dataset.k;ctl[k]=v==='true'?true:v==='false'?false:v;saveCtl();applyCtl();const st=overlay.scrollTop;show(controlsCard(),true);overlay.scrollTop=st}
 else if(a==='host')hostLobby();
 else if(a==='join')joinLobby('');
 else if(a==='dojoin')doJoin();
 else if(a==='invite'&&net){const url=location.origin+location.pathname+'?join='+net.code;
  const copy=()=>{try{navigator.clipboard.writeText(url).then(()=>toast('Invite link copied'),()=>toast(url))}catch(_){toast(url)}};
  if(navigator.share)navigator.share({title:'Iron Squad',text:'Join my Iron Squad game. Code '+net.code,url}).catch(()=>{});else copy()}
});
overlay.addEventListener('input',e=>{if(e.target.id==='mapName'){const m=getMapById(e.target.dataset.id);if(m){m.name=e.target.value.trim().slice(0,24)||'Untitled';saveMaps()}return}if(e.target.id==='codeIn'){const v=cleanCode(e.target.value);if(v!==e.target.value)e.target.value=v;joinCode=v}});
document.getElementById('pauseBtn').addEventListener('click',togglePause);
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',()=>{muted=!muted;document.getElementById('waves').style.opacity=muted?.15:1;muteBtn.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');if(!muted)initAudio()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='guest'){if(state==='play')send({t:'pause'})}else pause()}else if(state==='play'||state==='paused')wake()});
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
addEventListener('pointerdown',()=>{if(ac&&ac.state==='suspended')ac.resume()});

/* ---------- input ---------- */
const KEYDIR={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
 if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')){if(e.key==='Enter'&&e.target.id==='codeIn'){e.preventDefault();doJoin()}return}
 if(e.code==='KeyM'){requestMine();return}
 if(e.code in KEYDIR){e.preventDefault();const d=KEYDIR[e.code];if(!input.keys.includes(d))input.keys.push(d)}
 else if(e.code==='Space'||e.code==='KeyJ'||e.code==='KeyK'){e.preventDefault();input.fireKey=true}
 else if(e.code==='KeyP'||e.code==='Escape')togglePause();
 else if(e.code==='Enter'&&overlay.hidden===false){const b=overlay.querySelector('.btn:not(:disabled)');if(b&&document.activeElement!==b)b.click()}});
addEventListener('keyup',e=>{if(e.code in KEYDIR){const d=KEYDIR[e.code];input.keys=input.keys.filter(k=>k!==d)}else if(e.code==='Space'||e.code==='KeyJ'||e.code==='KeyK')input.fireKey=false});
addEventListener('blur',()=>{input.keys=[];input.fireKey=false;input.touchDir=null;input.fireTouch=false});
const pad=document.getElementById('pad'),pbs=[document.getElementById('pu'),document.getElementById('pr'),document.getElementById('pd'),document.getElementById('pl')];
let padId=null;
function padDir(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 if(Math.hypot(dx,dy)<10)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)}
function setPad(d){if(d!==input.touchDir&&d!=null)buzz(8);input.touchDir=d;pbs.forEach((b,i)=>b.classList.toggle('on',i===d))}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}setPad(padDir(e));initAudio()});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)setPad(padDir(e))});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;setPad(null)}}));
const fireBtn=document.getElementById('fire');
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();try{fireBtn.setPointerCapture(e.pointerId)}catch(_){}input.fireTouch=true;fireBtn.classList.add('on');initAudio()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>fireBtn.addEventListener(ev,()=>{input.fireTouch=false;fireBtn.classList.remove('on')}));
document.addEventListener('contextmenu',e=>{if(!(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.id==='mapCode')))e.preventDefault()});
const mineBtn=document.getElementById('mineBtn'),mineN=document.getElementById('mineN');
function requestMine(){if(state!=='play')return;if(mode==='guest')send({t:'mine'});else input.mineReq=true}
mineBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();requestMine();buzz(15)});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- sizing + loop ---------- */
const stage=document.getElementById('stage'),screen=document.getElementById('screen');
function fit(){const r=stage.getBoundingClientRect(),s=Math.max(160,Math.floor(Math.min(r.width,r.height)));screen.style.width=screen.style.height=s+'px';
 const dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(s*dpr);cv.height=Math.round(s*dpr);scale=cv.width/WD;scanPat=null;buildGround()}
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);addEventListener('resize',fit);fit();
applyCtl();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);netTick(dt);render();updateHud();musicSync();requestAnimationFrame(loop)}
titleScreen();requestAnimationFrame(loop);
try{const mp=new URLSearchParams(location.search).get('map');if(mp){const rows=decodeMap(mp);if(rows){try{history.replaceState(null,'',location.pathname)}catch(e){}if(myMaps.length<12){const m=newMapObj('Shared map',rows);myMaps.push(m);saveMaps();openEditor(m.id);toast('Map added to My maps. Tap Test to play it.')}else toast('My maps is full. Delete a map to add this one.')}}}catch(e){}

/* Co-op shows up only when the page is served by the Iron Squad worker. */
if(/^https?:$/.test(location.protocol)){
 fetch('/api/ping',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||j.game!=='ironsquad')return;netAvailable=true;
  const jp=cleanCode(new URLSearchParams(location.search).get('join'));
  if(jp&&state==='title'){try{history.replaceState(null,'',location.pathname)}catch(e){}joinLobby(jp)}
  else if(state==='title')show(titleCard());
 }).catch(()=>{});
}
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body>
</html>
