# Tilecraft runs as a Cloudflare Worker (not Pages) because online play needs a
# Durable Object to hold each game. The game itself is the static site in ./public.
name = "tilecraft"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
